name: AURA fast article quality audit

on:
  push:
    branches: [main]
    paths:
      - 'public/news/articles.json'
      - 'scripts/audit-newsroom.mjs'
      - 'src/lib/articleSchema.js'
  workflow_dispatch:

concurrency:
  group: aura-editorial-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check article-depth and evidence changes
        run: node scripts/audit-newsroom.mjs --changed --strict
      # Full builds remain available via the manual Run workflow action,
      # without rerunning npm install for every routine editorial JSON update.
      - name: Install dependencies for full release build
        if: github.event_name == 'workflow_dispatch'
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify the complete production site
        if: github.event_name == 'workflow_dispatch'
        run: npm run build
