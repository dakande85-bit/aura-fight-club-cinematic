name: AURA official media gallery build
on:
  push:
    branches:
      - main
      - feature/editorial-official-media-gallery-20261018
    paths:
      - 'src/components/OfficialMediaGallery.jsx'
      - 'src/data/officialMedia.js'
      - 'src/styles/official-media.css'
      - 'src/pages/EditorialPages.jsx'
      - 'src/pages/AdminArticles.jsx'
      - 'src/lib/articleSchema.js'
      - '.github/workflows/aura-media-gallery.yml'
  pull_request:
    paths:
      - 'src/components/OfficialMediaGallery.jsx'
      - 'src/data/officialMedia.js'
      - 'src/styles/official-media.css'
      - 'src/pages/EditorialPages.jsx'
      - 'src/pages/AdminArticles.jsx'
      - 'src/lib/articleSchema.js'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies without modifying repository lockfiles
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify newsroom, images, SEO and production bundle
        run: npm run build
