name: Fighter pages and Spanish layout build

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/DiscoveryPages.jsx'
      - 'src/pages/FighterComparePage.jsx'
      - 'src/pages/SpanishSite.jsx'
      - 'src/data/seoEntities.js'
      - 'src/data/auraTop50.js'
      - 'src/data/boxingPhotography.js'
      - 'src/styles/aura-top50.css'
      - 'scripts/audit-aura-top50.mjs'
      - 'scripts/audit-fighter-photo-url-health.mjs'
      - 'scripts/audit-fighter-bout-links.mjs'
      - 'src/data/fighterUpcoming.js'
      - 'scripts/generate-sitemaps.mjs'
      - 'scripts/prerender-seo.mjs'
      - 'scripts/verify-prerender.mjs'
      - 'src/components/Header.jsx'
      - 'src/styles/fight-hub.css'
      - 'src/AppRouter.jsx'
      - '.github/workflows/aura-fighter-pages-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node scripts/audit-aura-top50.mjs
      - run: node scripts/audit-fighter-photo-url-health.mjs
      - run: node scripts/audit-fighter-bout-links.mjs
      - run: npm run build
