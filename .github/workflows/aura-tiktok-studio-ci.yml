name: Validate TikTok news studio
on:
  pull_request:
    paths:
      - 'src/pages/AdminSocial.jsx'
      - 'src/pages/AdminTrailerStudio.jsx'
      - 'src/lib/trailerStudio.js'
      - 'src/lib/footageLinks.js'
      - 'src/components/FootageLinkPanel.jsx'
      - 'src/styles/aura-trailer-studio.css'
      - 'scripts/render-cinematic-trailer.py'
      - 'tests/trailer-studio.test.mjs'
      - 'tests/trailer-render-smoke.py'
      - 'src/pages/TikTokLanding.jsx'
      - 'src/lib/tiktokStudio.js'
      - 'src/lib/tiktokCardCanvas.js'
      - 'src/styles/aura-social-studio.css'
      - 'src/styles/aura-tiktok-landing.css'
      - 'src/AppRouter.jsx'
      - 'src/components/SEO.jsx'
      - 'tests/tiktok-studio.test.mjs'
      - '.github/workflows/aura-tiktok-studio-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Test social captions and attribution
        run: node --test tests/tiktok-studio.test.mjs tests/trailer-studio.test.mjs
      - name: Validate offline trailer renderer syntax
        run: python3 -m py_compile scripts/render-cinematic-trailer.py
      - name: Install offline render tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Render a two-second synthetic fight teaser end to end
        run: python3 tests/trailer-render-smoke.py
      - name: Production build with news and media audits
        run: npm run build
