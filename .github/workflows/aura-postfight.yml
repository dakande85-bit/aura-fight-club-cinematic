# Paused at the owner's request on 12 October 2026.
# News articles are now researched and written in ChatGPT, reviewed, and committed
# to public/news/articles.json via GitHub. No OpenAI API key or paid news runs required.
name: AURA post-fight AI publisher (paused)

# Manual-only: disabled scheduled API-driven publishing, October 2026.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Manual research preview — requires separately configured API key'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Manual editorial publishing only
        run: |
          echo "Automatic AI-generated publishing is paused."
          echo "Prepare verified stories in ChatGPT and commit them via GitHub."
          echo "Use the quality check workflow to validate copy and the social workflow for assets."
