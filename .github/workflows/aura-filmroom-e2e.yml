name: Film Room — real footage end-to-end demonstration
on:
  pull_request:
    paths:
      - 'scripts/render-fight-production.py'
      - 'scripts/test-filmroom-e2e.py'
      - '.github/workflows/aura-filmroom-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render_sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure FFmpeg is available
        run: ffmpeg -version | head -1
      - name: Render real historic boxing footage into both MP4 formats
        run: python scripts/test-filmroom-e2e.py /tmp/aura-filmroom-e2e
      - name: Retain editable video test outputs
        uses: actions/upload-artifact@v4
        with:
          name: aura-real-boxing-editor-sample
          path: /tmp/aura-filmroom-e2e/exports/
          retention-days: 7
