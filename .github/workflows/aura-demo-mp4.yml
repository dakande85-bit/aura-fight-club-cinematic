name: Prepare browser-compatible boxing demo clip
on:
  pull_request:
    paths:
      - '.github/workflows/aura-demo-mp4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/real-footage-production-studio')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/real-footage-production-studio
          persist-credentials: true
      - name: Prepare static H.264 MP4 from public-domain boxing film
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p public/demos
          curl --fail --location --retry 3 --max-time 60 -A "Aura Fight Club real boxing public-domain test" -o /tmp/aura-historical-source.webm https://upload.wikimedia.org/wikipedia/commons/0/07/Men_Boxing.webm
          ffmpeg -hide_banner -loglevel error -y -ss 6.5 -i /tmp/aura-historical-source.webm -t 12 -an -vf 'scale=480:360:force_original_aspect_ratio=decrease,pad=480:360:(ow-iw)/2:(oh-ih)/2:black,setsar=1,fps=20' -c:v libx264 -preset veryfast -crf 29 -profile:v baseline -level 3.0 -pix_fmt yuv420p -movflags +faststart public/demos/boxing-1891-test.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of json public/demos/boxing-1891-test.mp4
          test "$(stat -c%s public/demos/boxing-1891-test.mp4)" -gt 45000
          test "$(stat -c%s public/demos/boxing-1891-test.mp4)" -lt 4000000
      - name: Commit immutable source video to the editor's existing feature branch
        run: |
          git config user.name 'aura-demo-assets[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add public/demos/boxing-1891-test.mp4
          if git diff --cached --quiet; then
            echo "Static boxing MP4 already committed."
          else
            git commit -m "Provide local H264 MP4 boxing demo for iPhone playback"
            git push origin HEAD:feature/real-footage-production-studio
          fi
