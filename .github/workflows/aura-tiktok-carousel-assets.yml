name: Render reviewed TikTok carousel assets
on:
  push:
    branches:
      - feature/tiktok-news-studio-oct15
    paths:
      - .github/workflows/aura-tiktok-carousel-assets.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aura-tiktok-carousel-assets
  cancel-in-progress: true
jobs:
  render-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Render 15 original JPEGs without APIs or external photography
        run: npm run social:cards
      - name: Commit publicly accessible media only on this feature branch
        run: |
          git config user.name "aura-newsroom-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news/tiktok/
          if git diff --cached --quiet; then
            echo "No new carousel images to commit."
          else
            git commit -m "Generate AURA TikTok editorial carousel JPEGs"
            git push origin HEAD:feature/tiktok-news-studio-oct15
          fi
