name: Render reviewed TikTok carousel assets
on:
  push:
    branches:
      - feature/tiktok-news-studio-oct15
    paths:
      - .github/workflows/aura-tiktok-carousel-assets.yml
      - scripts/build-tiktok-cards.mjs
      - scripts/fetch-tiktok-photo-sources.mjs
      - data/tiktok-photo-licences.json
      - data/tiktok-editorial-packs.json
      - data/tiktok-ai-covers.json
      - scripts/import-tiktok-ai-covers.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aura-tiktok-carousel-assets
  cancel-in-progress: true
jobs:
  render-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Download and verify explicitly CC-licensed real fighter photographs
        run: node scripts/fetch-tiktok-photo-sources.mjs
      - name: Render 15 fighter-photo and analysis JPEGs
        env:
          REQUIRE_CURATED_PHOTOS: '1'
        run: npm run social:cards
      - name: Use AI illustrations as cover images in the 3 five-slide carousel packs
        run: node scripts/import-tiktok-ai-covers.mjs
      - name: Commit publicly accessible media only on this feature branch
        run: |
          git config user.name "aura-newsroom-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news/tiktok/
          if git diff --cached --quiet; then
            echo "No new carousel images to commit."
          else
            git commit -m "Generate AURA TikTok editorial carousel JPEGs"
            git push origin HEAD:feature/tiktok-news-studio-oct15
          fi
