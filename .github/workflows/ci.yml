name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/production-architecture-repair

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run security:check
      - run: npm run build
