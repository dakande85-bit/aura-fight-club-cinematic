name: Update Spanish news translations
on:
  push:
    branches: [main]
    paths:
      - public/news/articles.json
      - scripts/translate-articles-es.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Translate new or changed stories
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: node scripts/translate-articles-es.mjs
      - name: Commit Spanish translation cache
        run: |
          if git diff --quiet -- public/news/articles.es.json; then
            echo "No Spanish translation updates."
            exit 0
          fi
          git config user.name "aura-translation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news/articles.es.json
          git commit -m "Update Spanish article translations"
          git push origin HEAD:main
