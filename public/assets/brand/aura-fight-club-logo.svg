<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
  <title id="title">AURA Fight Club</title>
  <desc id="desc">AURA Fight Club wordmark</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#f5f5f5"/>
      <stop offset="58%" stop-color="#bdbdbd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="900" height="210" fill="none"/>
  <g filter="url(#softShadow)">
    <text x="450" y="112" text-anchor="middle" fill="url(#silver)" font-family="Arial Black, Impact, Haettenschweiler, 'Helvetica Neue Condensed Black', sans-serif" font-size="104" font-weight="900" letter-spacing="18">AURA</text>
    <text x="450" y="172" text-anchor="middle" fill="url(#silver)" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="34">FIGHT CLUB</text>
  </g>
</svg>
