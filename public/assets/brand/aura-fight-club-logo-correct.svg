<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title">
  <title>AURA Fight Club</title>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f4f4f4"/>
      <stop offset="70%" stop-color="#b9b9b9"/>
      <stop offset="100%" stop-color="#f7f7f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="900" height="220" fill="none"/>
  <g filter="url(#shadow)">
    <text x="450" y="118" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="108" font-weight="900" letter-spacing="28" fill="url(#silver)">AURA</text>
    <text x="450" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="36" fill="#f2f2f2">FIGHT CLUB</text>
  </g>
</svg>
